sections:
  - key: fx
    label: Feature Experimentation
    elements:
      - type: secret
        key: apiToken
        label: Personal access token
        help: >-
          In FX: Profile > API Access > Generate new token. Needs write access to the
          project's flags and events. Leave blank to keep the saved one.
      - type: text
        key: sdkKey
        label: Site SDK key
        help: >-
          The SDK key your site decides with (FX: Settings > Environments). The project and
          environment are read from it, so experiments always land where the site looks.
      - type: button
        label: Save
        action: saveFx
        style: primary
  - key: cms
    label: CMS API client
    elements:
      - type: text
        key: clientId
        label: Client ID
        help: >-
          In the CMS: Settings > API Keys. Reads the open item's versions to find its
          variations. Ending an experiment also writes content (publishing the winner,
          deleting variations), which needs a key with content write access.
      - type: secret
        key: clientSecret
        label: Client secret
        help: Shown once when the API key is created. Leave blank to keep the saved one.
      - type: toggle
        key: allowDelete
        label: Let "End experiment" delete CMS variations
        defaultValue: false
        help: >-
          Deleting a variation is permanent and cannot be undone. The extension can't tell
          which editor clicked, so this is off until an admin turns it on.
      - type: button
        label: Save
        action: saveCms
        style: primary
